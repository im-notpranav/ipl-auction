# Backup pinger for the Render free tier. The server also pings itself, but if the
# instance ever does fall asleep, only outside traffic can wake it up again.
# Set the repo variable RENDER_URL (Settings → Secrets and variables → Actions →
# Variables), e.g. https://your-app.onrender.com
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL repo variable is not set; skipping."
            exit 0
          fi
          # A cold start can take ~50s, so allow retries with a generous timeout.
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 "${RENDER_URL%/}/healthz"
